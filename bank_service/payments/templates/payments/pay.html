<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>模拟银行支付</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    main {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .panel {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }
    .header {
      padding: 22px 28px;
      background: #12355b;
      color: #fff;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      letter-spacing: 0;
    }
    .content {
      padding: 28px;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .item {
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      background: #fafafa;
    }
    .label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .value {
      font-size: 18px;
      word-break: break-all;
    }
    .amount {
      color: #b42318;
      font-weight: 700;
    }
    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: 600;
    }
    select,
    input {
      box-sizing: border-box;
      width: 100%;
      height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 0 12px;
      font-size: 15px;
    }
    button {
      width: 100%;
      height: 44px;
      margin-top: 22px;
      border: 0;
      border-radius: 6px;
      background: #0f766e;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .error {
      padding: 12px 14px;
      margin-bottom: 20px;
      border: 1px solid #fecaca;
      border-radius: 6px;
      background: #fef2f2;
      color: #991b1b;
    }
    @media (max-width: 640px) {
      main {
        margin: 20px auto;
      }
      .summary {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<main>
  <section class="panel">
    <div class="header">
      <h1>模拟银行支付</h1>
    </div>
    <div class="content">
      {% if error %}
        <div class="error">{{ error }}</div>
      {% endif %}

      <div class="summary">
        <div class="item">
          <div class="label">订单号</div>
          <div class="value">{{ params.order_no|default:"-" }}</div>
        </div>
        <div class="item">
          <div class="label">支付金额</div>
          <div class="value amount">¥{{ params.amount|default:"0.00" }}</div>
        </div>
        <div class="item">
          <div class="label">商户 ID</div>
          <div class="value">{{ params.merchant_id|default:"-" }}</div>
        </div>
        <div class="item">
          <div class="label">时间戳</div>
          <div class="value">{{ params.timestamp|default:"-" }}</div>
        </div>
      </div>

      <form method="post" action="{% url 'pay-process' %}">
        {% csrf_token %}
        <input type="hidden" name="order_no" value="{{ params.order_no }}">
        <input type="hidden" name="amount" value="{{ params.amount }}">
        <input type="hidden" name="merchant_id" value="{{ params.merchant_id }}">
        <input type="hidden" name="timestamp" value="{{ params.timestamp }}">
        <input type="hidden" name="signature" value="{{ params.signature }}">
        <input type="hidden" name="return_url" value="{{ params.return_url }}">
        <input type="hidden" name="callback_url" value="{{ params.callback_url }}">
        <input type="hidden" name="bound_account_number" value="{{ params.account_number }}">

        <label for="account_number">付款账户</label>
        <select id="account_number" name="account_number" {% if not is_valid %}disabled{% endif %}>
          {% for account in accounts %}
            <option value="{{ account.account_number }}">
              {{ account.account_number }} - {{ account.owner_name }} - 余额 ¥{{ account.balance }}
            </option>
          {% empty %}
            <option value="">未找到已绑定银行卡</option>
          {% endfor %}
        </select>

        <label for="pay_password">支付密码</label>
        <input id="pay_password" name="pay_password" type="password" autocomplete="off" {% if not is_valid %}disabled{% endif %}>

        <button type="submit" {% if not is_valid %}disabled{% endif %}>确认付款</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
